// Перехват sysctl (обман детекта отладки)
int fake_sysctl(int *name, u_int namelen, void *oldp, size_t *oldlenp, void *newp, size_t newlen) {
    if (namelen >= 4 && name[0] == CTL_KERN && name[1] == KERN_PROC && name[2] == KERN_PROC_PID) {
        int res = sysctl(name, namelen, oldp, oldlenp, newp, newlen);
        if (res == 0 && oldp && *oldlenp >= sizeof(struct kinfo_proc)) {
            struct kinfo_proc *kp = (struct kinfo_proc *)oldp;
            kp->kp_proc.p_flag &= ~P_TRACED;
        }
        return res;
    }
    return sysctl(name, namelen, oldp, oldlenp, newp, newlen);
}

